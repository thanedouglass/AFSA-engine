[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afsa-engine"
version = "0.1.0"
description = "Privacy-preserving AFSA conversational assessment vertical slice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pipecat-ai",
  "langchain",
  "langchain-google-genai>=4.5.0",
  "google-genai>=3.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["afsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
